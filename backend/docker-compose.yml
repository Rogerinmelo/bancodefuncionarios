services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bnc_funcionarios
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bnc_funcionarios"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set local http://minio:9000 minioadmin minioadmin; do sleep 1; done;
      /usr/bin/mc mb -p local/bnc-fotos || true;
      /usr/bin/mc anonymous set download local/bnc-fotos || true;
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      minio-create-bucket:
        condition: service_completed_successfully
    environment:
      APP_NAME: BNC Funcionarios API
      API_PREFIX: /api/v1
      DATABASE_URL: postgresql+psycopg://postgres:postgres@postgres:5432/bnc_funcionarios
      JWT_SECRET_KEY: trocar-esta-chave-em-producao
      JWT_REFRESH_SECRET_KEY: trocar-refresh-chave-em-producao
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      STORAGE_BUCKET: bnc-fotos
      STORAGE_REGION: us-east-1
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_USE_SSL: "false"
      MAX_UPLOAD_SIZE_BYTES: 5242880
      ALLOWED_UPLOAD_MIME_TYPES: image/jpeg,image/png,image/webp
      SIGNED_URL_EXPIRES_SECONDS: 3600
    ports:
      - "8000:8000"

volumes:
  postgres_data:
  minio_data:
